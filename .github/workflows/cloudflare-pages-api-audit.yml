name: Cloudflare Pages API forensic audit

on:
  push:
    branches:
      - ops/cloudflare-pages-api-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_PROJECT: testagram-flutter-web
    steps:
      - name: Repair Testagram Pages build configuration and verify preview
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")
          base="https://api.cloudflare.com/client/v4"
          account="$base/accounts/$CF_ACCOUNT_ID"
          project="$account/pages/projects/$CF_PROJECT"

          # Flutter's checked-in build script produces build/web. The previous
          # Pages Git integration had empty build/output settings, so previews
          # could report success while publishing no site files. Keep production
          # Git auto-deploy disabled: production remains behind the explicit
          # confirmation workflow in this repository.
          payload="$(jq -n '{
            build_config: {
              build_command: "bash cloudflare-pages/build.sh",
              destination_dir: "build/web",
              root_dir: "/",
              build_caching: true
            },
            source: {
              type: "github",
              config: {
                owner: "Trendyzima",
                owner_id: "251381317",
                repo_name: "testagram-flutter-client-",
                repo_id: "1451885976",
                production_branch: "main",
                pr_comments_enabled: true,
                deployments_enabled: true,
                production_deployments_enabled: false,
                preview_deployment_setting: "all",
                preview_branch_includes: ["*"],
                preview_branch_excludes: [],
                path_includes: ["*"],
                path_excludes: []
              }
            }
          }')"
          patch_body="$(mktemp)"
          patch_status="$(curl --silent --show-error --max-time 60 -o "$patch_body" -w '%{http_code}' -X PATCH "${auth[@]}" --data "$payload" "$project" || true)"
          echo "===== PAGES_PROJECT_PATCH HTTP $patch_status ====="
          jq -c '{success,errors:[.errors[]? | {code,message}],result:{name:.result.name,build_config:.result.build_config,source:.result.source}}' "$patch_body" || head -c 3000 "$patch_body"
          if [[ "$patch_status" != "200" ]] || [[ "$(jq -r '.success // false' "$patch_body")" != "true" ]]; then
            echo "::error::Cloudflare Pages project update was not accepted. No production deployment was triggered."
            exit 1
          fi
          jq -e '
            .result.build_config.build_command == "bash cloudflare-pages/build.sh" and
            .result.build_config.destination_dir == "build/web" and
            .result.source.config.production_deployments_enabled == false and
            .result.source.config.preview_deployment_setting == "all"
          ' "$patch_body" >/dev/null
          rm -f "$patch_body"
          echo "Verified: Flutter preview build is configured; automatic production deployments are disabled."

          # Wait for the Pages Git integration to publish this exact commit
          # using the corrected build settings. A green stage alone is not
          # enough: the deployed root must return the Flutter app shell.
          deployment=""
          for attempt in $(seq 1 60); do
            deployments="$(curl --silent --show-error --max-time 30 "${auth[@]}" "$project/deployments?env=preview&per_page=100")"
            deployment="$(jq -c --arg sha "$GITHUB_SHA" '[.result[]? | select(.deployment_trigger.metadata.commit_hash == $sha)][0] // empty' <<<"$deployments")"
            if [[ -n "$deployment" ]]; then
              stage="$(jq -r '.latest_stage.name // "unknown"' <<<"$deployment")"
              status="$(jq -r '.latest_stage.status // "unknown"' <<<"$deployment")"
              preview_url="$(jq -r '.url' <<<"$deployment")"
              alias_url="$(jq -r '.aliases[0] // empty' <<<"$deployment")"
              echo "Preview commit $GITHUB_SHA: stage=$stage status=$status attempt=$attempt/60"
              if [[ "$status" == "failure" || "$status" == "canceled" ]]; then
                jq -c '{id,url,latest_stage,stages}' <<<"$deployment"
                echo "::error::Cloudflare failed to build the Flutter preview."
                exit 1
              fi
              if [[ "$stage" == "deploy" && "$status" == "success" ]]; then
                break
              fi
            else
              echo "Waiting for Cloudflare to register preview commit $GITHUB_SHA (attempt $attempt/60)"
            fi
            sleep 20
          done
          if [[ -z "$deployment" || "$(jq -r '.latest_stage.status // "unknown"' <<<"$deployment")" != "success" || "$(jq -r '.latest_stage.name // "unknown"' <<<"$deployment")" != "deploy" ]]; then
            echo "::error::Timed out waiting for the exact commit's Pages preview deployment."
            exit 1
          fi

          preview_url="$(jq -r '.url' <<<"$deployment")"
          alias_url="$(jq -r '.aliases[0] // empty' <<<"$deployment")"
          for host_url in "$preview_url" "$alias_url"; do
            [[ -n "$host_url" ]] || continue
            page="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl --silent --show-error --location --max-time 45 -D "$headers" -o "$page" -w '%{http_code}' "$host_url/" || true)"
            echo "PREVIEW_SMOKE $status $host_url"
            if [[ "$status" != "200" ]] || ! grep -Fq 'flutter_bootstrap.js?v=' "$page" || ! grep -Fq 'main.dart.js?v=' "$page"; then
              echo "::error::Preview host did not serve the Flutter web shell and versioned assets: $host_url"
              head -c 1000 "$page" || true
              rm -f "$page" "$headers"
              exit 1
            fi
            rm -f "$page" "$headers"
          done
          echo "Verified the exact commit's hash URL and branch alias serve the Flutter web app."

          request() {
            local label="$1" url="$2" body status
            body="$(mktemp)"
            status="$(curl --silent --show-error --max-time 30 -o "$body" -w '%{http_code}' "${auth[@]}" "$url" || true)"
            echo "===== $label HTTP $status =====" >&2
            jq -c '{success,errors:[.errors[]? | {code,message}],result}' "$body" 2>/dev/null | head -c 16000 >&2 || head -c 2000 "$body" >&2
            echo >&2
            printf '%s' "$body"
          }

          body="$(request PAGES_PROJECT "$project")"
          rm -f "$body"
          body="$(request ACCESS_APPLICATIONS "$account/access/apps?per_page=1000")"
          rm -f "$body"

          for script in pages-worker--23716892-preview pages-worker--23716892-production; do
            body="$(request WORKER_SCRIPT "$account/workers/scripts/$script")"
            rm -f "$body"
          done
          body="$(request WORKER_SCRIPTS_LIST "$account/workers/scripts")"
          rm -f "$body"

          body="$(request ZONE_LOOKUP "$base/zones?name=testagram.site")"
          zone_id="$(jq -r '.result[0].id // empty' "$body" 2>/dev/null || true)"
          rm -f "$body"
          if [[ -n "$zone_id" ]]; then
            body="$(request ZONE_ACCESS_APPLICATIONS "$base/zones/$zone_id/access/apps?per_page=1000")"
            rm -f "$body"
            body="$(request DNS_RECORDS "$base/zones/$zone_id/dns_records?per_page=100")"
            rm -f "$body"
            body="$(request WORKER_ROUTES "$base/zones/$zone_id/workers/routes")"
            rm -f "$body"
          else
            echo "ZONE_LOOKUP did not return a readable zone id; DNS and route inspection cannot proceed."
          fi

          for host in testagram-flutter-web.pages.dev www.testagram.site testagram.site; do
            headers="$(mktemp)"
            code="$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --max-time 20 "https://$host/" || true)"
            printf 'LIVE_HOST %s %s ' "$code" "$host"
            tr -d '\r' < "$headers" | grep -iE '^(server:|cf-ray:|content-type:|location:|cf-cache-status:)' | tr '\n' ' ' || true
            echo
            rm -f "$headers"
          done
