name: Cloudflare Pages API forensic audit

on:
  push:
    branches:
      - ops/cloudflare-pages-api-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_PROJECT: testagram-flutter-web
    steps:
      - name: Inspect Cloudflare Pages API resources
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CF_ACCOUNT_ID:-}" && -n "${CF_API_TOKEN:-}" ]]
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")
          base="https://api.cloudflare.com/client/v4"
          request() {
            local label="$1" url="$2" body status
            body="$(mktemp)"
            status="$(curl --silent --show-error --max-time 30 -o "$body" -w '%{http_code}' "${auth[@]}" "$url" || true)"
            echo "$label HTTP $status:"
            jq -c 'if type=="object" then {success,errors:[.errors[]? | {code,message}],messages,result} else . end' "$body" 2>/dev/null || head -c 3000 "$body"
            rm -f "$body"
          }
          request TOKEN_VERIFY "$base/accounts/$CF_ACCOUNT_ID/tokens/verify"
          request PROJECTS "$base/accounts/$CF_ACCOUNT_ID/pages/projects"
          request PROJECT_DETAILS "$base/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT"
          request DEPLOYMENTS_NO_PAGING "$base/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments"
          request DEPLOYMENTS_PAGED "$base/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments?page=1&per_page=20"
          request PROJECT_DOMAINS "$base/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/domains"
      - name: Confirm public hostname responses
        shell: bash
        run: |
          set -euo pipefail
          for host in \
            d1ba3c67.testagram-flutter-web.pages.dev \
            feat-auth-mobile-visual-over.testagram-flutter-web.pages.dev \
            34991aba.testagram-flutter-web.pages.dev \
            testagram-flutter-web.pages.dev; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$host/" || true)"
            printf '%s %s\n' "$code" "$host"
          done
