name: Testagram production domain smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: testagram-domain-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify canonical web and ActivityPub production contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe production hostnames and federation identity
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          failed=0

          content_type() {
            awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$1" | tail -n1
          }

          apex_headers="$tmp/apex.headers"
          apex_status="$(curl --silent --show-error --max-time 25 -D "$apex_headers" -o "$tmp/apex.body" -w '%{http_code}' https://testagram.site/ || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$apex_headers" | tail -n1)"
          echo "Apex root: HTTP $apex_status; Location: ${location:-none}"
          if [[ "$apex_status" != "308" || "$location" != "https://www.testagram.site/" ]]; then
            echo "::error::Apex ordinary web traffic must return HTTP 308 to https://www.testagram.site/."
            failed=1
          fi

          for item in "www_root|https://www.testagram.site/" "www_signin|https://www.testagram.site/?mode=signin" "pages_dev|https://testagram-flutter-web.pages.dev/"; do
            label="${item%%|*}"
            url="${item#*|}"
            status="$(curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 25 -o "$tmp/$label.body" -w '%{http_code}' "$url" || true)"
            echo "$label: HTTP $status"
            if [[ "$status" != "200" ]] || ! grep -Fq 'flutter_bootstrap.js' "$tmp/$label.body"; then
              echo "::error::$label did not return the Flutter application shell (HTTP $status)."
              failed=1
            fi
          done

          discovery_headers="$tmp/nodeinfo-discovery.headers"
          discovery_status="$(curl --silent --show-error --max-time 25 -H 'Accept: application/json' -D "$discovery_headers" -o "$tmp/nodeinfo-discovery.json" -w '%{http_code}' https://testagram.site/.well-known/nodeinfo || true)"
          discovery_type="$(content_type "$discovery_headers")"
          echo "NodeInfo discovery: HTTP $discovery_status; Content-Type: ${discovery_type:-none}"
          if [[ "$discovery_status" != "200" || "$discovery_type" != *"application/json"* ]] ||
             ! jq -e '.links | any(.rel == "http://nodeinfo.diaspora.software/ns/schema/2.1" and .href == "https://testagram.site/nodeinfo/2.1")' "$tmp/nodeinfo-discovery.json" >/dev/null 2>&1; then
            echo "::error::NodeInfo discovery must return the canonical 2.1 schema link as JSON."
            cat "$tmp/nodeinfo-discovery.json" 2>/dev/null || true
            failed=1
          fi

          nodeinfo_status="$(curl --silent --show-error --max-time 25 -H 'Accept: application/json' -D "$tmp/nodeinfo.headers" -o "$tmp/nodeinfo.json" -w '%{http_code}' https://testagram.site/nodeinfo/2.1 || true)"
          nodeinfo_type="$(content_type "$tmp/nodeinfo.headers")"
          echo "NodeInfo document: HTTP $nodeinfo_status; Content-Type: ${nodeinfo_type:-none}"
          if [[ "$nodeinfo_status" != "200" || "$nodeinfo_type" != *"application/json"* ]] ||
             ! jq -e '.version == "2.1" and .software.name == "testagram" and (.protocols | index("activitypub") != null) and (.services.inbound | type == "array") and (.services.outbound | type == "array")' "$tmp/nodeinfo.json" >/dev/null 2>&1; then
            echo "::error::NodeInfo 2.1 document is missing required Testagram/ActivityPub fields."
            cat "$tmp/nodeinfo.json" 2>/dev/null || true
            failed=1
          fi

          webfinger_headers="$tmp/webfinger.headers"
          webfinger_status="$(curl --silent --show-error --max-time 25 -H 'Accept: application/jrd+json' -D "$webfinger_headers" -o "$tmp/webfinger.json" -w '%{http_code}' 'https://testagram.site/.well-known/webfinger?resource=acct:crissbeat@testagram.site' || true)"
          webfinger_type="$(content_type "$webfinger_headers")"
          echo "Real-account WebFinger: HTTP $webfinger_status; Content-Type: ${webfinger_type:-none}"
          if [[ "$webfinger_status" != "200" || "$webfinger_type" != *"application/jrd+json"* ]] ||
             ! jq -e '.subject == "acct:crissbeat@testagram.site" and (.links | any(.rel == "self" and .type == "application/activity+json" and (.href == "https://testagram.site/users/crissbeat")))' "$tmp/webfinger.json" >/dev/null 2>&1; then
            echo "::error::The real Testagram account must resolve through WebFinger to its canonical ActivityPub actor."
            cat "$tmp/webfinger.json" 2>/dev/null || true
            failed=1
          else
            actor_url="$(jq -r '.links[] | select(.rel == "self" and .type == "application/activity+json") | .href' "$tmp/webfinger.json" | head -n1)"
            actor_status="$(curl --silent --show-error --max-time 25 -H 'Accept: application/activity+json' -D "$tmp/actor.headers" -o "$tmp/actor.json" -w '%{http_code}' "$actor_url" || true)"
            actor_type="$(content_type "$tmp/actor.headers")"
            echo "Real-account actor: HTTP $actor_status; Content-Type: ${actor_type:-none}"
            if [[ "$actor_status" != "200" || "$actor_type" != *"application/activity+json"* ]] ||
               ! jq -e --arg actor "$actor_url" '.type == "Person" and .id == $actor and .preferredUsername == "crissbeat" and .publicKey.owner == $actor and (.publicKey.publicKeyPem | type == "string" and contains("BEGIN PUBLIC KEY"))' "$tmp/actor.json" >/dev/null 2>&1; then
              echo "::error::The resolved account actor must expose its matching ID, handle and public signing key."
              cat "$tmp/actor.json" 2>/dev/null || true
              failed=1
            fi
          fi

          unknown_status="$(curl --silent --show-error --max-time 25 -H 'Accept: application/jrd+json' -D "$tmp/unknown.headers" -o "$tmp/unknown.json" -w '%{http_code}' 'https://testagram.site/.well-known/webfinger?resource=acct:testagramprobe2026@testagram.site' || true)"
          unknown_type="$(content_type "$tmp/unknown.headers")"
          echo "Unknown-account negative control: HTTP $unknown_status; Content-Type: ${unknown_type:-none}"
          if [[ "$unknown_status" != "404" || "$unknown_type" != *"application/json"* ]] ||
             ! jq -e '.error == "account_not_found"' "$tmp/unknown.json" >/dev/null 2>&1; then
            echo "::error::Unknown account must produce the Federation service's structured account_not_found response, not a proxy or frontend response."
            cat "$tmp/unknown.json" 2>/dev/null || true
            failed=1
          fi

          {
            echo "## Testagram production domain and ActivityPub acceptance"
            echo "- Apex ordinary web traffic: HTTP 308 to www"
            echo "- www and Pages.dev: Flutter application shell"
            echo "- NodeInfo: canonical 2.1 discovery and document"
            echo "- WebFinger: real account crissbeat@testagram.site resolves to its actor"
            echo "- Actor: Person document ID, handle and public key agree"
            echo "- Negative control: unknown account returns structured account_not_found"
            echo "- Read-only: no DNS, Worker, Pages, deployment, or account changes"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
