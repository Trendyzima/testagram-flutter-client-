name: Testagram production domain smoke test

on:
  pull_request:
    paths:
      - ".github/workflows/domain-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: testagram-domain-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Check apex, Flutter, NodeInfo and real-account WebFinger
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Probe production hostnames and federation contracts
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          failed=0

          apex_headers="$tmp/apex.headers"
          apex_status="$(curl --silent --show-error --max-time 25 -D "$apex_headers" -o "$tmp/apex.body" -w '%{http_code}' https://testagram.site/ || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$apex_headers" | tail -n1)"
          echo "Apex root: HTTP $apex_status; Location: ${location:-none}"
          if [[ "$apex_status" != "308" || "$location" != "https://www.testagram.site/" ]]; then
            echo "::error::Apex must permanently redirect ordinary web traffic to https://www.testagram.site/."
            failed=1
          fi

          for item in "www_root|https://www.testagram.site/" "www_signin|https://www.testagram.site/?mode=signin" "pages_dev|https://testagram-flutter-web.pages.dev/"; do
            label="${item%%|*}"
            url="${item#*|}"
            status="$(curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 25 -o "$tmp/$label.body" -w '%{http_code}' "$url" || true)"
            echo "$label: HTTP $status"
            if [[ "$status" != "200" ]] || ! grep -Fq 'flutter_bootstrap.js' "$tmp/$label.body"; then
              echo "::error::$label did not return the Flutter application shell (HTTP $status)."
              failed=1
            fi
          done

          nodeinfo_headers="$tmp/nodeinfo.headers"
          nodeinfo_status="$(curl --silent --show-error --connect-timeout 10 --max-time 25 -D "$nodeinfo_headers" -o "$tmp/nodeinfo-discovery.json" -w '%{http_code}' https://testagram.site/.well-known/nodeinfo || true)"
          nodeinfo_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$nodeinfo_headers" | tail -n1 | tr '[:upper:]' '[:lower:]')"
          echo "NodeInfo discovery: HTTP $nodeinfo_status; Content-Type: ${nodeinfo_type:-missing}"
          if [[ "$nodeinfo_status" != "200" || "$nodeinfo_type" != application/json* ]] || ! jq -e '.links | type == "array" and any(.[]; .rel == "http://nodeinfo.diaspora.software/ns/schema/2.1" and (.href | type == "string" and startswith("https://")))' "$tmp/nodeinfo-discovery.json" >/dev/null 2>&1; then
            echo "::error::Apex NodeInfo discovery must return JSON with a valid HTTPS NodeInfo 2.1 link, not the Flutter HTML shell."
            failed=1
          else
            nodeinfo_url="$(jq -r '.links[] | select(.rel == "http://nodeinfo.diaspora.software/ns/schema/2.1") | .href' "$tmp/nodeinfo-discovery.json" | head -n1)"
            nodeinfo_doc_status="$(curl --silent --show-error --connect-timeout 10 --max-time 25 -o "$tmp/nodeinfo-2.1.json" -w '%{http_code}' "$nodeinfo_url" || true)"
            echo "NodeInfo 2.1 document: HTTP $nodeinfo_doc_status"
            if [[ "$nodeinfo_doc_status" != "200" ]] || ! jq -e '(.software.name | type == "string" and length > 0) and (.protocols | type == "array" and index("activitypub") != null)' "$tmp/nodeinfo-2.1.json" >/dev/null 2>&1; then
              echo "::error::NodeInfo 2.1 must return a valid ActivityPub server document."
              failed=1
            fi
          fi

          resource="acct:crissbeat@testagram.site"
          webfinger_headers="$tmp/webfinger.headers"
          webfinger_status="$(curl --silent --show-error --connect-timeout 10 --max-time 25 --get --data-urlencode "resource=$resource" -D "$webfinger_headers" -o "$tmp/webfinger.json" -w '%{http_code}' https://testagram.site/.well-known/webfinger || true)"
          webfinger_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$webfinger_headers" | tail -n1 | tr '[:upper:]' '[:lower:]')"
          echo "WebFinger $resource: HTTP $webfinger_status; Content-Type: ${webfinger_type:-missing}"
          if [[ "$webfinger_status" != "200" || ( "$webfinger_type" != application/jrd+json* && "$webfinger_type" != application/json* ) ]] || ! jq -e --arg resource "$resource" '.subject == $resource and (.links | type == "array" and any(.[]; .rel == "self" and .type == "application/activity+json" and (.href | type == "string" and startswith("https://"))))' "$tmp/webfinger.json" >/dev/null 2>&1; then
            echo "::error::The real production account must resolve to a valid WebFinger JRD document with its ActivityPub self link."
            failed=1
          fi

          {
            echo "## Testagram production domain smoke test"
            echo "- Apex ordinary web traffic: HTTP 308 to www.testagram.site"
            echo "- www and Pages.dev: HTTP 200 with Flutter bootstrap"
            echo "- NodeInfo: valid JSON discovery and ActivityPub NodeInfo 2.1 document"
            echo "- WebFinger: acct:crissbeat@testagram.site must resolve to HTTP 200 JRD and an ActivityPub self link"
            echo "- Read-only: no DNS, Pages, Worker, deployment or application changes"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
