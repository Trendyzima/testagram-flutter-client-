name: Testagram production domain smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testagram-domain-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify canonical web and fail-closed ActivityPub production contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe production hostnames and federation identity
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          failed=0

          # Both production custom domains are active on the existing Pages
          # project. Ordinary auth routes must serve the Flutter shell on each;
          # the federation Worker keeps its own more-specific discovery route.
          for item in \
            "apex_root|https://testagram.site/" \
            "apex_signin|https://testagram.site/?mode=signin" \
            "apex_signup|https://testagram.site/?mode=signup" \
            "apex_forgot|https://testagram.site/?mode=forgot" \
            "www_root|https://www.testagram.site/" \
            "www_signin|https://www.testagram.site/?mode=signin" \
            "www_signup|https://www.testagram.site/?mode=signup" \
            "www_forgot|https://www.testagram.site/?mode=forgot" \
            "pages_dev|https://testagram-flutter-web.pages.dev/"; do
            label="${item%%|*}"
            url="${item#*|}"
            status="$(curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 25 -o "$tmp/$label.body" -w '%{http_code}' "$url" || true)"
            echo "$label: HTTP $status"
            if [[ "$status" != "200" ]] || ! grep -Fq 'flutter_bootstrap.js' "$tmp/$label.body"; then
              echo "::error::$label did not return the Flutter application shell (HTTP $status)."
              failed=1
            fi
          done

          # Public Federation is intentionally fail-closed until locked G3
          # protocol acceptance is independently completed. Do not assert live
          # NodeInfo/WebFinger identity while Caddy is required to return 503.
          for path in "/.well-known/nodeinfo" "/nodeinfo/2.1" "/.well-known/webfinger?resource=acct:probe@testagram.site"; do
            label="${path%%\?*}"
            safe_label="$(printf '%s' "$label" | tr '/.' '__')"
            status="$(curl --silent --show-error --max-time 25 -o "$tmp/$safe_label.body" -w '%{http_code}' "https://testagram.site$path" || true)"
            echo "Federation fail-closed $label: HTTP $status"
            if [[ "$status" != "503" ]] || ! grep -Fq 'Federation is disabled until locked G3 protocol acceptance passes.' "$tmp/$safe_label.body"; then
              echo "::error::Public Federation route $label must remain HTTP 503 until G3 acceptance passes."
              cat "$tmp/$safe_label.body" 2>/dev/null || true
              failed=1
            fi
          done

          {
            echo "## Testagram production domain and ActivityPub acceptance"
            echo "- Apex and www production domains: Flutter application shell for sign-in, signup and recovery routes"
            echo "- Pages.dev preview: Flutter application shell"
            echo "- Public NodeInfo and WebFinger remain HTTP 503 until locked G3 acceptance"
            echo "- Read-only: no DNS, Worker, Pages, deployment, or account changes"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
