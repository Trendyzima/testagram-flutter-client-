name: Build Testagram Flutter web container

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "tool/**"
      - "cloudflare-pages/build.sh"
      - "cloudflare-pages/_headers"
      - "deploy/web/**"
      - ".github/workflows/web-container-release.yml"
  pull_request:
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "tool/**"
      - "cloudflare-pages/build.sh"
      - "cloudflare-pages/_headers"
      - "deploy/web/**"
      - ".github/workflows/web-container-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: testagram-web-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == 'Trendyzima/testagram-flutter-client-'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TESTAGRAM_API_URL: https://api.testagram.site
      # Keep ordinary native signup visible. Sensitive identity-evidence review
      # remains a separate workflow and is not a prerequisite for account creation.
      TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED: 'true'
      IMAGE: ghcr.io/trendyzima/testagram-web
    steps:
      - name: Check out Flutter client
        uses: actions/checkout@v4

      - name: Test native signup readiness policy
        shell: bash
        run: bash tool/signup-readiness-policy.sh --test

      - name: Verify canonical Backend native signup readiness
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          headers_file="$(mktemp)"
          trap 'rm -f "$response_file" "$headers_file"' EXIT
          status="$(curl --silent --show-error --max-time 20 \
            -D "$headers_file" -o "$response_file" -w '%{http_code}' -X POST \
            "$TESTAGRAM_API_URL/api/auth/signup" \
            -H 'Content-Type: application/json' \
            --data-binary '{"email":"signup-probe@example.invalid","username":"signup_probe","password":"short"}')"
          error_code="$(jq -r '.error.code // empty' "$response_file" 2>/dev/null || true)"
          if ! bash tool/signup-readiness-policy.sh "$status" "$error_code"; then
            location="$(awk 'BEGIN { IGNORECASE=1 } /^Location:/ { sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0 } END { print value }' "$headers_file")"
            content_type="$(awk 'BEGIN { IGNORECASE=1 } /^Content-Type:/ { sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0 } END { print value }' "$headers_file")"
            echo "::error::Native signup readiness probe returned an unexpected response (HTTP $status, code=$error_code, content-type=$content_type, location=$location). Web image publication is blocked."
            if [[ "$status" == "308" ]]; then
              echo "::error::The canonical API hostname is redirecting this POST instead of reaching native authentication. Check Cloudflare API Worker origin routing and its edge-token/X-Forwarded-Host handoff to Caddy."
            fi
            exit 1
          fi
          echo "Canonical native signup endpoint reached password validation; ordinary signup is independent of identity review and no account or email was created."

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build and validate production Flutter web output
        run: bash cloudflare-pages/build.sh

      - name: Verify existing-account authentication is present in the web bundle
        shell: bash
        run: |
          set -euo pipefail
          for marker in 'Sign in' 'Reset password'; do
            grep -aFq "$marker" build/web/main.dart.js || {
              echo "::error::Production Flutter bundle is missing authentication UI marker: $marker"
              exit 1
            }
          done

      - name: Require native account creation in every web release
        shell: bash
        run: |
          set -euo pipefail
          grep -aFq 'Sign up' build/web/main.dart.js || {
            echo "::error::Registration is enabled but the visible sign-up entry is missing."
            exit 1
          }
          grep -aFq 'Create account' build/web/main.dart.js || {
            echo "::error::Registration is enabled but the native Create account flow is missing."
            exit 1
          }

      - name: Verify container build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          test -s build/web/main.dart.js
          test -s deploy/web/nginx.conf
          test -s deploy/web/Dockerfile
          grep -Fq 'flutter_bootstrap.js' build/web/index.html
          grep -Fq 'try_files $uri $uri/ /index.html' deploy/web/nginx.conf

      - name: Build container locally for pull-request validation
        if: github.event_name == 'pull_request'
        run: docker build --pull --file deploy/web/Dockerfile --tag testagram-web:ci .

      - name: Smoke-test pull-request container
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m -p 127.0.0.1:18080:8080 testagram-web:ci)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz | grep -Fq '"service":"testagram-web"'; then ready=true; break; fi
            sleep 2
          done
          [[ "$ready" == "true" ]] || { docker logs "$container_id"; exit 1; }
          curl --fail --silent http://127.0.0.1:18080/ | grep -Fq 'flutter_bootstrap.js'

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable commit-tagged web image
        if: github.event_name != 'pull_request'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.title=Testagram Flutter Web
            org.opencontainers.image.source=https://github.com/Trendyzima/testagram-flutter-client-
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify anonymous GHCR pull for InstaBox
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "$IMAGE@$IMAGE_DIGEST"

      - name: Smoke-test the published image
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          immutable_image="$IMAGE@$IMAGE_DIGEST"
          docker pull "$immutable_image"
          container_id="$(docker run -d --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m -p 127.0.0.1:18080:8080 "$immutable_image")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz | grep -Fq '"service":"testagram-web"'; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == "true" ]] || { docker logs "$container_id"; exit 1; }
          curl --fail --silent http://127.0.0.1:18080/ | grep -Fq 'flutter_bootstrap.js'
          echo "Verified $immutable_image" >> "$GITHUB_STEP_SUMMARY"
          echo "Flutter web image is published and smoke-tested; no production deployment or DNS change was performed." >> "$GITHUB_STEP_SUMMARY"
