name: Flutter client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform scaffolding
        run: flutter create --org com.xclone --project-name app --platforms=android,ios,web .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Enforce backend-only dependency boundary
        run: dart run tool/check_dependency_boundary.dart
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test --reporter expanded
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Build Flutter web
        run: flutter build web --release
