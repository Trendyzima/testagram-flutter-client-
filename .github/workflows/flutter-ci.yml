name: Flutter client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT || 'https://fra.cloud.appwrite.io/v1' }}
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID || '6af01d97002875d6d7bd' }}
      TESTAGRAM_API_URL: ${{ vars.TESTAGRAM_API_URL || 'https://8080-agq4me2xgrgx5ge52ts437tqea.instabox.tech' }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform scaffolding
        run: flutter create --org com.xclone --project-name app --platforms=android,ios,web .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Enforce backend-only dependency boundary
        run: dart run tool/check_dependency_boundary.dart
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test --reporter expanded --dart-define=TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED=true
      - name: Report optional Appwrite configuration
        if: env.APPWRITE_PROJECT_ID == ''
        run: echo "::warning::APPWRITE_PROJECT_ID is not set; the app will show its configuration-required screen until it is added."
      - name: Build Android debug APK
        run: |
          flutter build apk --debug \
            --dart-define="APPWRITE_ENDPOINT=$APPWRITE_ENDPOINT" \
            --dart-define="APPWRITE_PROJECT_ID=$APPWRITE_PROJECT_ID" \
            --dart-define="TESTAGRAM_API_URL=$TESTAGRAM_API_URL" \
            --dart-define="TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED=true"
      - name: Build Android release-mode QA APK (not production signed)
        run: |
          flutter build apk --release \
            --dart-define="APPWRITE_ENDPOINT=$APPWRITE_ENDPOINT" \
            --dart-define="APPWRITE_PROJECT_ID=$APPWRITE_PROJECT_ID" \
            --dart-define="TESTAGRAM_API_URL=$TESTAGRAM_API_URL" \
            --dart-define="TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED=true"
      - name: Build Android release-mode QA App Bundle (not production signed)
        run: |
          flutter build appbundle --release \
            --dart-define="APPWRITE_ENDPOINT=$APPWRITE_ENDPOINT" \
            --dart-define="APPWRITE_PROJECT_ID=$APPWRITE_PROJECT_ID" \
            --dart-define="TESTAGRAM_API_URL=$TESTAGRAM_API_URL" \
            --dart-define="TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED=true"
      - name: Build Flutter web
        run: |
          flutter build web --release \
            --dart-define="APPWRITE_ENDPOINT=$APPWRITE_ENDPOINT" \
            --dart-define="APPWRITE_PROJECT_ID=$APPWRITE_PROJECT_ID" \
            --dart-define="TESTAGRAM_API_URL=$TESTAGRAM_API_URL" \
            --dart-define="TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED=true"
          install -D cloudflare-pages/_headers build/web/_headers
      - name: Verify versioned Flutter entry points
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_SHA"
          sed -i "s#flutter_bootstrap\\.js#flutter_bootstrap.js?v=${version}#g" build/web/index.html
          sed -i "s#main\\.dart\\.js#main.dart.js?v=${version}#g" build/web/flutter_bootstrap.js
          grep -Fq "flutter_bootstrap.js?v=${version}" build/web/index.html
          grep -Fq "main.dart.js?v=${version}" build/web/flutter_bootstrap.js
      - name: Verify compiled authentication UI markers
        shell: bash
        run: |
          set -euo pipefail
          for marker in 'Sign up' 'Reset password' 'Create your account' 'Start secure identity review'; do
            if ! grep -aFq "$marker" build/web/main.dart.js; then
              echo "::error::Compiled Flutter web bundle is missing auth UI marker: $marker"
              exit 1
            fi
          done
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v6
        with:
          name: testagram-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android release-mode QA artifacts (not production signed)
        uses: actions/upload-artifact@v6
        with:
          name: testagram-android-release-qa
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload Flutter web bundle
        uses: actions/upload-artifact@v6
        with:
          name: testagram-web-build
          path: build/web
          if-no-files-found: error
          retention-days: 14
