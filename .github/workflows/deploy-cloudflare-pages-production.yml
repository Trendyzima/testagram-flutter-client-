name: Deploy Testagram Flutter Web to Production Pages

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "tool/**"
      - "cloudflare-pages/build.sh"
      - "cloudflare-pages/_headers"
      - "deploy/web/**"
      - ".github/workflows/deploy-cloudflare-pages-production.yml"
  workflow_dispatch:
    inputs:
      confirm_production_pages_deploy:
        description: Confirm deployment to the existing production Pages branch and its already-active testagram.site/www.testagram.site domains.
        required: true
        type: boolean
        default: false

concurrency:
  group: testagram-cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'Trendyzima/testagram-flutter-client-' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm_production_pages_deploy == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      TESTAGRAM_API_URL: https://api.testagram.site
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_CACHE_PURGE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: testagram-flutter-web
      CF_PAGES_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Check out Flutter client
        uses: actions/checkout@v5

      - name: Validate production deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_CACHE_PURGE_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Production Pages deployment is missing required GitHub production configuration: $name"
              exit 1
            fi
          done
          cache_token_verify="$(curl --retry 2 --retry-all-errors --retry-delay 2 -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_CACHE_PURGE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          if [[ "$(jq -r '.success // false' <<<"$cache_token_verify")" != "true" || "$(jq -r '.result.status // "unknown"' <<<"$cache_token_verify")" != "active" ]]; then
            echo "::error::The dedicated cache-purge token is not active. No Pages deployment was attempted."
            exit 1
          fi
          [[ "$TESTAGRAM_API_URL" == "https://api.testagram.site" ]]
          if [[ "${TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED:-}" != "" ]]; then
            echo "::error::Retired identity enrollment override detected; refusing production build."
            exit 1
          fi

      - name: Verify live native signup readiness
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          # Probe with an intentionally invalid password so the route reaches
          # password validation without creating an account or sending email.
          # Public signup must not be blocked by the optional identity workflow.
          status="$(curl --silent --show-error --max-time 20 -o "$response" -w '%{http_code}' -X POST \
            "$TESTAGRAM_API_URL/api/auth/signup" \
            -H 'Content-Type: application/json' \
            --data '{"email":"signup-readiness@example.invalid","username":"signup_readiness_probe","password":"short"}')"
          code="$(jq -r '.error.code // empty' "$response" 2>/dev/null || true)"
          if [[ "$status" != "400" || "$code" != "INVALID_PASSWORD" ]]; then
            echo "::error::Production native signup did not reach ordinary password validation (HTTP $status, code=$code). Refusing to publish the web frontend."
            exit 1
          fi
          echo "Production signup is reachable independently of identity review; probe created no account and sent no email."

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build and test production Flutter web bundle
        run: bash cloudflare-pages/build.sh

      - name: Require all production authentication pages in the bundle
        shell: bash
        run: |
          set -euo pipefail
          for marker in 'Sign in' 'Sign up' 'Create account' 'Forgot password?' 'Reset password'; do
            grep -aFq "$marker" build/web/main.dart.js || {
              echo "::error::Production Flutter bundle is missing authentication page marker: $marker"
              exit 1
            }
          done
          grep -Fq "flutter_bootstrap.js?v=$GITHUB_SHA" build/web/index.html
          grep -Fq "main.dart.js?v=$GITHUB_SHA" build/web/flutter_bootstrap.js

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify existing production Pages project and custom domains
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          verify="$(curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -H "$auth" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")"
          if [[ "$(jq -r '.success // false' <<<"$verify")" != "true" || "$(jq -r '.result.status // "unknown"' <<<"$verify")" != "active" ]]; then
            echo "::error::Cloudflare API token is not active. No Pages deployment was attempted."
            exit 1
          fi

          zone_response="$(curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -H "$auth" \
            "https://api.cloudflare.com/client/v4/zones?name=testagram.site&account.id=$CLOUDFLARE_ACCOUNT_ID&status=active&per_page=2")"
          if [[ "$(jq -r '.success // false' <<<"$zone_response")" != "true" ]] || [[ "$(jq '.result | length' <<<"$zone_response")" != "1" ]]; then
            echo "::error::Could not identify exactly one active testagram.site zone with the existing Cloudflare API token. Grant that token Zone:Read access; no new credential is required."
            jq -c '{success,errors,messages}' <<<"$zone_response" || true
            exit 1
          fi
          zone_id="$(jq -r '.result[0].id // empty' <<<"$zone_response")"
          zone_name="$(jq -r '.result[0].name // empty' <<<"$zone_response")"
          if [[ "$zone_name" != "testagram.site" || ! "$zone_id" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "::error::Cloudflare returned an unexpected zone identity; refusing to purge any cache."
            exit 1
          fi
          echo "CLOUDFLARE_ZONE_ID=$zone_id" >> "$GITHUB_ENV"
          echo "Discovered the active testagram.site zone using the existing Cloudflare API token."
          project="$(curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -H "$auth" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT")"
          if [[ "$(jq -r '.success // false' <<<"$project")" != "true" ]]; then
            echo "::error::The existing Testagram Pages project could not be verified."
            exit 1
          fi
          production_branch="$(jq -r '.result.production_branch // empty' <<<"$project")"
          if [[ -z "$production_branch" || "$production_branch" == "preview" || ! "$production_branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::The existing Pages project returned an invalid or preview-only production branch ('${production_branch:-unset}'). Refusing to guess a production target."
            exit 1
          fi
          echo "PAGES_PRODUCTION_BRANCH=$production_branch" >> "$GITHUB_ENV"

          domains="$(curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -H "$auth" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT/domains")"
          for domain in testagram.site www.testagram.site; do
            if ! jq -e --arg domain "$domain" '.success == true and any(.result[]?; .name == $domain and .status == "active")' <<<"$domains" >/dev/null; then
              echo "::error::Expected existing active Pages domain $domain was not found. No DNS or domain binding will be changed."
              exit 1
            fi
          done
          echo "Verified existing project $CLOUDFLARE_PAGES_PROJECT, production branch $production_branch, and both active production domains. No domain or DNS mutation is performed."

      - name: Deploy the existing Pages project to its production branch
        run: wrangler pages deploy build/web --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "$PAGES_PRODUCTION_BRANCH" --commit-dirty=true

      - name: Purge only the production authentication page cache entries
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $CLOUDFLARE_CACHE_PURGE_API_TOKEN"
          zone_id="$CLOUDFLARE_ZONE_ID"
          files='[
            "https://testagram.site/",
            "https://testagram.site/?mode=signin",
            "https://testagram.site/?mode=signup",
            "https://testagram.site/?mode=forgot",
            "https://www.testagram.site/",
            "https://www.testagram.site/?mode=signin",
            "https://www.testagram.site/?mode=signup",
            "https://www.testagram.site/?mode=forgot"
          ]'
          payload="$(jq -cn --argjson files "$files" '{files:$files}')"
          purge_response="$(curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -X POST \
            -H "$auth" -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache")"
          if [[ "$(jq -r '.success // false' <<<"$purge_response")" != "true" ]]; then
            echo "::error::Cloudflare did not confirm targeted purge of the eight authentication page URLs."
            jq -c '{success,errors,messages}' <<<"$purge_response" || true
            exit 1
          fi
          echo "Cloudflare confirmed targeted invalidation of eight authentication page URLs. No unrelated cache entries were purged."

      - name: Wait for production Pages propagation and verify auth on both hostnames
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          wait_for_release() {
            local host="$1"
            local path="$2"
            local url="https://$host$path"
            for attempt in $(seq 1 24); do
              if curl --fail --location --silent --show-error --max-time 45 \
                -H 'Cache-Control: no-cache' "$url" -o "$tmp/page.html"; then
                if grep -Fq "flutter_bootstrap.js?v=$GITHUB_SHA" "$tmp/page.html"; then
                  echo "Verified versioned production HTML on https://$host$path"
                  return 0
                fi
              fi
              echo "Waiting for Cloudflare Pages propagation on https://$host$path (attempt $attempt/24)"
              sleep 5
            done
            echo "::error::https://$host$path did not serve this production release ($GITHUB_SHA) after 120 seconds."
            grep -Eo 'flutter_bootstrap\.js[^" ]*' "$tmp/page.html" | head -n 3 || true
            return 1
          }

          paths=("/?release=$GITHUB_SHA" "/?mode=signin&release=$GITHUB_SHA" "/?mode=signup&release=$GITHUB_SHA" "/?mode=forgot&release=$GITHUB_SHA")
          for host in testagram-flutter-web.pages.dev testagram.site www.testagram.site; do
            for path in "${paths[@]}"; do
              wait_for_release "$host" "$path"
            done
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 45 \
              -H 'Cache-Control: no-cache' "https://$host/flutter_bootstrap.js?v=$GITHUB_SHA" -o "$tmp/flutter_bootstrap.js"
            grep -Fq "main.dart.js?v=$GITHUB_SHA" "$tmp/flutter_bootstrap.js"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 60 \
              -H 'Cache-Control: no-cache' "https://$host/main.dart.js?v=$GITHUB_SHA" -o "$tmp/main.dart.js"
            for marker in 'Sign in' 'Sign up' 'Create account' 'Forgot password?' 'Reset password'; do
              grep -aFq "$marker" "$tmp/main.dart.js" || {
                echo "::error::https://$host is missing production authentication UI marker: $marker"
                exit 1
              }
            done
            echo "Verified production sign-in, signup and recovery bundle on https://$host"
          done

          federation_status="$(curl --silent --show-error --max-time 20 -o "$tmp/webfinger.json" -w '%{http_code}' \
            'https://testagram.site/.well-known/webfinger?resource=acct:production-probe@testagram.site' || true)"
          echo "Apex WebFinger response: HTTP $federation_status; body=$(head -c 250 "$tmp/webfinger.json" 2>/dev/null || true)"
          if [[ "$federation_status" != "503" ]] || ! grep -Eiq 'Federation temporarily unavailable|Federation is disabled until locked G3 protocol acceptance passes' "$tmp/webfinger.json"; then
            echo "::error::The existing apex federation Worker route must remain fail-closed with HTTP 503 during the Pages release."
            cat "$tmp/webfinger.json" 2>/dev/null || true
            exit 1
          fi

          {
            echo "## Testagram production authentication release"
            echo "- Pages production alias, testagram.site and www.testagram.site serve this release: $GITHUB_SHA"
            echo "- Sign in, sign up, forgot-password and reset-password bundle markers verified"
            echo "- Canonical native signup readiness probe passed"
            echo "- Existing custom domains and DNS were not changed"
            echo "- Apex federation Worker route remains independently fail-closed"
          } >> "$GITHUB_STEP_SUMMARY"
