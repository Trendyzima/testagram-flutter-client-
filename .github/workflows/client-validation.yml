name: Validate Flutter client

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/client-validation.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/client-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-client-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enforce client-only dependency boundary
        run: dart run tool/check_dependency_boundary.dart

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter expanded
