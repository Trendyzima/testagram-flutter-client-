name: Validate Flutter client

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/client-validation.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/client-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-client-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate production TV health monitor contract
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/tv-health-monitor.yml").read_text()
          monitor = Path("tool/tv_health_monitor.mjs").read_text()
          assert "vars.TESTAGRAM_API_URL || 'https://api.testagram.site'" in workflow, "TV health monitor must default to the canonical production Backend API"
          assert "8080-agq4me2xgrgx5ge52ts437tqea.instabox.tech" not in workflow, "TV health monitor must not use an ephemeral development origin"
          assert "audience=testagram-tv-health" in workflow, "TV health monitor must use the dedicated GitHub OIDC audience"
          assert "/internal/tv/catalog" in monitor and "/internal/tv/health" in monitor, "TV monitor must use the protected Backend catalogue and health routes"
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enforce client-only dependency boundary
        run: dart run tool/check_dependency_boundary.dart

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter expanded --dart-define=TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED=true
