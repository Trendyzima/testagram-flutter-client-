name: Validate Flutter client

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/client-validation.yml'
      - '.github/workflows/domain-smoke.yml'
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - '.github/workflows/deploy-cloudflare-pages-production.yml'
      - '.github/workflows/tv-health-monitor.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/client-validation.yml'
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - '.github/workflows/deploy-cloudflare-pages-production.yml'
      - '.github/workflows/domain-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-client-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate production Pages workflow syntax and release boundary
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true); puts "Validated #{path}" }' \
            .github/workflows/deploy-cloudflare-pages.yml \
            .github/workflows/deploy-cloudflare-pages-production.yml \
            .github/workflows/domain-smoke.yml
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/deploy-cloudflare-pages-production.yml").read_text()
          assert "400" in workflow and "INVALID_PASSWORD" in workflow, "Production Pages must require the live native signup readiness response"
          assert "503 IDENTITY_REVIEW_REQUIRED" not in workflow, "Identity review must not be accepted as a signup prerequisite"
          assert '--branch "$PAGES_PRODUCTION_BRANCH"' in workflow, "Production Pages must deploy to the existing configured production branch"
          assert "testagram.site" in workflow and "www.testagram.site" in workflow, "Both production hostnames must be verified"
          assert "/.well-known/webfinger" in workflow, "The apex federation Worker route must be checked after deployment"
          assert "Sign up" in workflow and "Forgot password?" in workflow and "Reset password" in workflow, "All required authentication pages must be verified"
          assert "purge_cache" in workflow and '"files:$files"' in workflow, "Production must invalidate only the explicit authentication page URLs before edge verification"
          assert "purge_everything" not in workflow, "Production must not purge unrelated site/API cache entries"
          PY

      - name: Validate production TV health monitor contract
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/tv-health-monitor.yml").read_text()
          monitor = Path("tool/tv_health_monitor.mjs").read_text()
          tv_workflow = Path(".github/workflows/tv-health-monitor.yml").read_text()
          domain_smoke = Path(".github/workflows/domain-smoke.yml").read_text()
          assert "  schedule:" not in tv_workflow, "TV monitor must not create scheduled traffic that wakes the Free InstaBox machine"
          assert "  push:" not in tv_workflow, "TV monitor must run only when explicitly dispatched"
          assert "  schedule:" not in domain_smoke, "Domain smoke checks must not act as a scheduled keepalive"
          assert "vars.TESTAGRAM_API_URL || 'https://api.testagram.site'" in workflow, "TV health monitor must default to the canonical production Backend API"
          assert "8080-agq4me2xgrgx5ge52ts437tqea.instabox.tech" not in workflow, "TV health monitor must not use an ephemeral development origin"
          assert "audience=testagram-tv-health" in workflow, "TV health monitor must use the dedicated GitHub OIDC audience"
          assert "/internal/tv/catalog" in monitor and "/internal/tv/health" in monitor, "TV monitor must use the protected Backend catalogue and health routes"
          PY

      - name: Validate Node.js production monitor syntax
        run: node --check tool/tv_health_monitor.mjs

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enforce client-only dependency boundary
        run: dart run tool/check_dependency_boundary.dart

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter expanded
