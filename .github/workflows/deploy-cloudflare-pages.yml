name: Deploy Testagram Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testagram-pages-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT || 'https://cloud.appwrite.io/v1' }}
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
      TESTAGRAM_API_URL: ${{ vars.TESTAGRAM_API_URL || 'https://8080-agq4me2xgrgx5ge52ts437tqea.instabox.tech' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN2 }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_PAGES_PROJECT: testagram-flutter-web
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in APPWRITE_PROJECT_ID CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::warning::Cloudflare web deployment is waiting for GitHub configuration: $name"
              missing=1
            fi
          done
          if [[ "$missing" == "1" ]]; then
            echo "::error::Production deployment blocked. Add APPWRITE_PROJECT_ID as a repository variable and CLOUDFLARE_ACCOUNT_ID plus CLOUDFLARE_API_TOKEN as repository secrets."
            exit 1
          fi
          for name in APPWRITE_ENDPOINT TESTAGRAM_API_URL; do
            case "${!name}" in
              https://*) ;;
              *) echo "::error::$name must use HTTPS in production"; exit 1 ;;
            esac
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify Cloudflare Pages API access
        shell: bash
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          verify="$(curl --retry 2 --retry-all-errors --retry-delay 2 -sS \
            -H "$auth_header" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")"
          if [[ "$(jq -r '.success // false' <<<"$verify")" != "true" || "$(jq -r '.result.status // "unknown"' <<<"$verify")" != "active" ]]; then
            echo "::error::The token stored in GitHub is not an active Cloudflare API token. Check for a stale, revoked, expired, malformed, or wrong token value."
            jq -c '{success, result: {status: .result.status}, errors: [.errors[]? | {code, message}]}' <<<"$verify"
            exit 1
          fi
          echo "Cloudflare token itself is active."

          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          response="$(curl --retry 2 --retry-all-errors --retry-delay 2 -sS \
            -H "$auth_header" \
            -H "Content-Type: application/json" "$endpoint")"
          if [[ "$(jq -r '.success // false' <<<"$response")" != "true" ]]; then
            echo "::error::Cloudflare recognizes the token, but it cannot access Pages for the configured account. Check that CLOUDFLARE_ACCOUNT_ID belongs to the same Cloudflare account selected in the token's Account Resources and that the token has Account > Cloudflare Pages > Edit."
            jq -c '{errors: [.errors[]? | {code, message}], messages}' <<<"$response"
            exit 1
          fi
          echo "Cloudflare Pages API access verified."

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform files
        run: flutter create --org com.xclone --project-name app --platforms=web .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enforce dependency boundary
        run: dart run tool/check_dependency_boundary.dart

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build production web bundle
        run: |
          flutter build web --release --base-href / \
            --dart-define="APPWRITE_ENDPOINT=$APPWRITE_ENDPOINT" \
            --dart-define="APPWRITE_PROJECT_ID=$APPWRITE_PROJECT_ID" \
            --dart-define="TESTAGRAM_API_URL=$TESTAGRAM_API_URL"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Create Cloudflare Pages project if needed
        shell: bash
        run: |
          set -euo pipefail
          projects="$(wrangler pages project list)"
          if ! grep -Fq "$CLOUDFLARE_PAGES_PROJECT" <<<"$projects"; then
            wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy build/web --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main --commit-dirty=true

      - name: Route production DNS to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_DNS_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN2 DNS edit secret}"
          : "${CLOUDFLARE_ZONE_ID:?Missing CLOUDFLARE_ZONE_ID secret}"
          api="https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records"
          auth="Authorization: Bearer $CLOUDFLARE_DNS_API_TOKEN"

          for hostname in testagram.site www.testagram.site; do
            for type in A AAAA CNAME; do
              records="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS \
                -H "$auth" "$api?type=$type&name=$hostname")"
              if [[ "$(jq -r '.success // false' <<<"$records")" != "true" ]]; then
                echo "::error::Cannot inspect DNS records for $hostname."
                jq -c '{errors,messages}' <<<"$records"
                exit 1
              fi
              while IFS= read -r record_id; do
                [[ -z "$record_id" ]] && continue
                deleted="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -X DELETE \
                  -H "$auth" "$api/$record_id")"
                if [[ "$(jq -r '.success // false' <<<"$deleted")" != "true" ]]; then
                  echo "::error::Could not replace conflicting $type record for $hostname."
                  jq -c '{errors,messages}' <<<"$deleted"
                  exit 1
                fi
              done < <(jq -r '.result[]?.id' <<<"$records")
            done

            created="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -X POST \
              -H "$auth" -H "Content-Type: application/json" \
              --data "$(jq -nc --arg name "$hostname" '{type:"CNAME",name:$name,content:"testagram-flutter-web.pages.dev",ttl:1,proxied:true}')" "$api")"
            if [[ "$(jq -r '.success // false' <<<"$created")" != "true" ]]; then
              echo "::error::Could not route $hostname to Cloudflare Pages."
              jq -c '{errors,messages}' <<<"$created"
              exit 1
            fi
            echo "$hostname now points to testagram-flutter-web.pages.dev"
          done

      - name: Attach and verify production domains
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT/domains"

          for domain in testagram.site www.testagram.site; do
            current="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/$domain")"

            if [[ "$(jq -r '.success // false' <<<"$current")" != "true" ]]; then
              response="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -X POST \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$(jq -nc --arg name "$domain" '{name:$name}')" "$base")"
              if [[ "$(jq -r '.success // false' <<<"$response")" != "true" ]]; then
                echo "::error::Could not attach $domain to Pages."
                jq -c '{errors,messages}' <<<"$response"
                exit 1
              fi
            fi

            active=false
            for attempt in $(seq 1 18); do
              current="$(curl --retry 2 --retry-all-errors --retry-delay 2 -sS \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/$domain")"
              if [[ "$(jq -r '.success // false' <<<"$current")" != "true" ]]; then
                echo "::error::Could not read Pages domain status for $domain."
                jq -c '{errors,messages}' <<<"$current"
                exit 1
              fi

              status="$(jq -r '.result.status // "unknown"' <<<"$current")"
              validation="$(jq -r '.result.validation_data.status // "unknown"' <<<"$current")"
              verification="$(jq -r '.result.verification_data.status // "unknown"' <<<"$current")"
              echo "$domain: status=$status validation=$validation verification=$verification"

              if [[ "$status" == "active" && "$validation" == "active" && "$verification" == "active" ]]; then
                active=true
                break
              fi
              if [[ "$status" == "error" || "$status" == "blocked" || "$status" == "deactivated" || \
                    "$validation" == "error" || "$validation" == "deactivated" || \
                    "$verification" == "error" || "$verification" == "blocked" || "$verification" == "deactivated" ]]; then
                echo "::error::Cloudflare rejected validation for $domain."
                jq -c '.result | {status,validation_data,verification_data}' <<<"$current"
                exit 1
              fi
              sleep 10
            done

            if [[ "$active" != "true" ]]; then
              echo "::error::Timed out waiting for $domain to become active. Check its DNS records and Cloudflare Pages domain validation."
              jq -c '.result | {status,validation_data,verification_data}' <<<"$current"
              exit 1
            fi
          done

      - name: Smoke-test production hostnames
        shell: bash
        run: |
          set -euo pipefail
          for hostname in testagram.site www.testagram.site; do
            page="$(mktemp)"
            if ! curl --fail --location --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
              --max-time 30 "https://$hostname/" -o "$page"; then
              echo "::error::https://$hostname did not return a successful response."
              rm -f "$page"
              exit 1
            fi
            if ! grep -Eq 'flutter_bootstrap\.js|main\.dart\.js' "$page"; then
              echo "::error::https://$hostname responded, but the page does not look like the deployed Flutter web app."
              rm -f "$page"
              exit 1
            fi
            rm -f "$page"
            echo "Verified Flutter web response from https://$hostname/"
          done
