name: Deploy Testagram Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testagram-pages-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT || 'https://cloud.appwrite.io/v1' }}
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
      TESTAGRAM_API_URL: ${{ vars.TESTAGRAM_API_URL || 'https://8080-agq4me2xgrgx5ge52ts437tqea.instabox.tech' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: 3f1334ddf9f27e9a3c8697eb1f409070
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: testagram-flutter-web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in APPWRITE_PROJECT_ID CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::warning::Cloudflare web deployment is waiting for GitHub configuration: $name"
              missing=1
            fi
          done
          if [[ "$missing" == "1" ]]; then
            echo "::error::Production deployment blocked. Add APPWRITE_PROJECT_ID as a repository variable and CLOUDFLARE_ACCOUNT_ID plus CLOUDFLARE_API_TOKEN as repository secrets."
            exit 1
          fi
          for name in APPWRITE_ENDPOINT TESTAGRAM_API_URL; do
            case "${!name}" in
              https://*) ;;
              *) echo "::error::$name must use HTTPS in production"; exit 1 ;;
            esac
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify Cloudflare Pages API access
        shell: bash
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          verify="$(curl --retry 2 --retry-all-errors --retry-delay 2 -sS \
            -H "$auth_header" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")"
          if [[ "$(jq -r '.success // false' <<<"$verify")" != "true" || "$(jq -r '.result.status // "unknown"' <<<"$verify")" != "active" ]]; then
            echo "::error::The token stored in GitHub is not an active Cloudflare API token. Check for a stale, revoked, expired, malformed, or wrong token value."
            jq -c '{success, result: {status: .result.status}, errors: [.errors[]? | {code, message}]}' <<<"$verify"
            exit 1
          fi
          echo "Cloudflare token itself is active."

          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          response="$(curl --retry 2 --retry-all-errors --retry-delay 2 -sS \
            -H "$auth_header" \
            -H "Content-Type: application/json" "$endpoint")"
          if [[ "$(jq -r '.success // false' <<<"$response")" != "true" ]]; then
            echo "::error::Cloudflare recognizes the token, but it cannot access Pages for the configured account. Check that CLOUDFLARE_ACCOUNT_ID belongs to the same Cloudflare account selected in the token's Account Resources and that the token has Account > Cloudflare Pages > Edit."
            jq -c '{errors: [.errors[]? | {code, message}], messages}' <<<"$response"
            exit 1
          fi
          echo "Cloudflare Pages API access verified."

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform files
        run: flutter create --org com.xclone --project-name app --platforms=web .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enforce dependency boundary
        run: dart run tool/check_dependency_boundary.dart

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build production web bundle
        run: |
          flutter build web --release --base-href / \
            --dart-define="APPWRITE_ENDPOINT=$APPWRITE_ENDPOINT" \
            --dart-define="APPWRITE_PROJECT_ID=$APPWRITE_PROJECT_ID" \
            --dart-define="TESTAGRAM_API_URL=$TESTAGRAM_API_URL"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Create Cloudflare Pages project if needed
        shell: bash
        run: |
          set -euo pipefail
          projects="$(wrangler pages project list)"
          if ! grep -Fq "$CLOUDFLARE_PAGES_PROJECT" <<<"$projects"; then
            wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy build/web --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main

      - name: Point production DNS to Flutter Pages
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          target="${CLOUDFLARE_PAGES_PROJECT}.pages.dev"
          for hostname in testagram.site www.testagram.site; do
            records="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS --get \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --data-urlencode "name=$hostname" \
              "$api/zones/$CLOUDFLARE_ZONE_ID/dns_records")"
            if [[ "$(jq -r '.success // false' <<<"$records")" != "true" ]]; then
              echo "::error::Cannot read DNS records for $hostname. Confirm the token has Zone > DNS > Edit for testagram.site."
              jq -c '{errors,messages}' <<<"$records"
              exit 1
            fi

            # Remove only conflicting web-host records; leave mail and verification records untouched.
            while IFS= read -r record; do
              record_id="$(jq -r '.id' <<<"$record")"
              record_type="$(jq -r '.type' <<<"$record")"
              if [[ "$record_type" == "CNAME" && "$(jq -r '.content' <<<"$record")" == "$target" ]]; then
                continue
              fi
              delete_result="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$api/zones/$CLOUDFLARE_ZONE_ID/dns_records/$record_id")"
              if [[ "$(jq -r '.success // false' <<<"$delete_result")" != "true" ]]; then
                echo "::error::Could not remove conflicting $record_type record for $hostname."
                jq -c '{errors,messages}' <<<"$delete_result"
                exit 1
              fi
            done < <(jq -c '.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME")' <<<"$records")

            # Create the required CNAME if one pointing at Pages is not already present.
            refreshed="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS --get \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --data-urlencode "name=$hostname" \
              "$api/zones/$CLOUDFLARE_ZONE_ID/dns_records")"
            if ! jq -e --arg target "$target" '.result[]? | select(.type == "CNAME" and .content == $target and .proxied == true)' <<<"$refreshed" >/dev/null; then
              create_result="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -X POST \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$(jq -nc --arg name "$hostname" --arg target "$target" '{type:"CNAME",name:$name,content:$target,ttl:1,proxied:true}')" \
                "$api/zones/$CLOUDFLARE_ZONE_ID/dns_records")"
              if [[ "$(jq -r '.success // false' <<<"$create_result")" != "true" ]]; then
                echo "::error::Could not point $hostname to $target."
                jq -c '{errors,messages}' <<<"$create_result"
                exit 1
              fi
            fi
            echo "$hostname now points to $target through Cloudflare DNS."
          done

      - name: Attach testagram.site and www.testagram.site
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT/domains"
          for domain in testagram.site www.testagram.site; do
            current="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/$domain")"
            if [[ "$(jq -r '.success // false' <<<"$current")" == "true" ]]; then
              echo "$domain is already attached to this Pages project."
              continue
            fi
            response="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg name "$domain" '{name:$name}')" "$base")"
            if [[ "$(jq -r '.success // false' <<<"$response")" != "true" ]]; then
              echo "::error::Could not attach $domain to Pages. Cloudflare response:"
              jq -c '{errors,messages}' <<<"$response"
              exit 1
            fi
            echo "$domain attached; Cloudflare validation status: $(jq -r '.result.status // "unknown"' <<<"$response")"
          done
