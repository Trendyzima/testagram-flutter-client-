name: Deploy Testagram Flutter Web Preview

# Cloudflare Pages deployments target the preview branch only and never manage custom domains. The separate guarded Worker cutover moves production www to the self-hosted Flutter origin; the apex remains the Backend/Federation identity origin.

on:
  workflow_dispatch:
    inputs:
      confirm_pages_preview_deploy:
        description: Confirm an intentional Pages preview deployment only; production www remains on the self-hosted Caddy origin.
        required: true
        type: boolean
        default: false
      confirm_identity_registration_ui:
        description: Confirm the canonical Backend registration gate has passed before exposing sign-up.
        required: true
        type: boolean
        default: false

concurrency:
  group: testagram-pages-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_pages_preview_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      TESTAGRAM_API_URL: https://api.testagram.site
      TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED: ${{ vars.TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED || 'true' }}
      CONFIRM_IDENTITY_REGISTRATION_UI: ${{ inputs.confirm_identity_registration_ui }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: testagram-flutter-web
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate preview build configuration
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::warning::Cloudflare web deployment is waiting for GitHub configuration: $name"
              missing=1
            fi
          done
          if [[ "$missing" == "1" ]]; then
            echo "::error::Pages preview deployment blocked. CLOUDFLARE_ACCOUNT_ID plus CLOUDFLARE_API_TOKEN as repository secrets."
            exit 1
          fi
          if [[ "$TESTAGRAM_API_URL" != "https://api.testagram.site" ]]; then
            echo "::error::Flutter builds must use the canonical API hostname https://api.testagram.site, never a direct VPS port URL."
            exit 1
          fi
          # GitHub Actions variables can contain accidental surrounding whitespace.
          # Normalize only the boundary whitespace, then validate and use that exact value
          # for every later deployment/build step.
          registration_ui_enabled="$(printf '%s' "$TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          case "$registration_ui_enabled" in
            true|false) ;;
            *) echo "::error::TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED must be true or false."; exit 1 ;;
          esac
          if [[ "$registration_ui_enabled" == "true" && "$CONFIRM_IDENTITY_REGISTRATION_UI" != "true" ]]; then
            echo "::error::Sign-up UI cannot be exposed without the separate identity-registration confirmation input."
            exit 1
          fi
          echo "TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED=$registration_ui_enabled" >> "$GITHUB_ENV"
          echo "registration_ui_enabled=$registration_ui_enabled" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify canonical Backend registration gate before exposing sign-up
        if: steps.validate.outputs.registration_ui_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Exercise the existing native signup route without creating an
          # account: a valid identity with a deliberately short password must
          # reach native password validation after the auth store is checked.
          response_file="$(mktemp)"
          headers_file="$(mktemp)"
          trap 'rm -f "$response_file" "$headers_file"' EXIT
          status="$(curl --silent --show-error --max-time 20 \
            -D "$headers_file" -o "$response_file" -w '%{http_code}' -X POST \
            "$TESTAGRAM_API_URL/api/auth/signup" \
            -H 'Content-Type: application/json' \
            --data-binary '{"email":"signup-probe@example.invalid","username":"signup_probe","password":"short"}')"
          error_code="$(jq -r '.error.code // empty' "$response_file" 2>/dev/null || true)"
          if [[ "$status" != "400" || "$error_code" != "INVALID_PASSWORD" ]]; then
            location="$(awk 'BEGIN { IGNORECASE=1 } /^Location:/ { sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0 } END { print value }' "$headers_file")"
            content_type="$(awk 'BEGIN { IGNORECASE=1 } /^Content-Type:/ { sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0 } END { print value }' "$headers_file")"
            echo "::error::Native signup probe did not reach password validation (HTTP $status, code=$error_code, content-type=$content_type, location=$location). No frontend release was performed."
            if [[ "$status" == "308" ]]; then
              echo "::error::The canonical API hostname is redirecting this POST instead of reaching native authentication. Check Cloudflare API Worker origin routing and its edge-token/X-Forwarded-Host handoff to Caddy; do not follow a cross-host redirect for this security probe."
            fi
            exit 1
          fi
          echo "Native signup endpoint is reachable and its authentication store accepted the probe; no account or email was created."

      - name: Verify Cloudflare Pages API access
        shell: bash
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          verify="$(curl --retry 2 --retry-all-errors --retry-delay 2 -sS \
            -H "$auth_header" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")"
          if [[ "$(jq -r '.success // false' <<<"$verify")" != "true" || "$(jq -r '.result.status // "unknown"' <<<"$verify")" != "active" ]]; then
            echo "::error::The token stored in GitHub is not an active Cloudflare API token. Check for a stale, revoked, expired, malformed, or wrong token value."
            jq -c '{success, result: {status: .result.status}, errors: [.errors[]? | {code, message}]}' <<<"$verify"
            exit 1
          fi
          echo "Cloudflare token itself is active."

          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          response="$(curl --retry 2 --retry-all-errors --retry-delay 2 -sS \
            -H "$auth_header" \
            -H "Content-Type: application/json" "$endpoint")"
          if [[ "$(jq -r '.success // false' <<<"$response")" != "true" ]]; then
            echo "::error::Cloudflare recognizes the token, but it cannot access Pages for the configured account. Check that CLOUDFLARE_ACCOUNT_ID belongs to the same Cloudflare account selected in the token's Account Resources and that the token has Account > Cloudflare Pages > Edit."
            jq -c '{errors: [.errors[]? | {code, message}], messages}' <<<"$response"
            exit 1
          fi
          echo "Cloudflare Pages API access verified."

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform files
        run: flutter create --org com.testagram --project-name app --platforms=web .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enforce dependency boundary
        run: dart run tool/check_dependency_boundary.dart

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build production web bundle
        run: |
          flutter build web --release --base-href / \
            --dart-define="TESTAGRAM_API_URL=$TESTAGRAM_API_URL" \
            --dart-define="TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED=$TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED"
          install -D cloudflare-pages/_headers build/web/_headers
          # Cloudflare's edge may retain an older response's cache metadata for
          # stable Flutter filenames. Version both JS entry points per commit.
          sed -i "s#flutter_bootstrap\\.js#flutter_bootstrap.js?v=${GITHUB_SHA}#g" build/web/index.html
          sed -i "s#main\\.dart\\.js#main.dart.js?v=${GITHUB_SHA}#g" build/web/flutter_bootstrap.js
          if ! grep -Fq "flutter_bootstrap.js?v=${GITHUB_SHA}" build/web/index.html; then
            echo "::error::Flutter index.html does not reference the versioned bootstrap."
            exit 1
          fi
          if ! grep -Fq "main.dart.js?v=${GITHUB_SHA}" build/web/flutter_bootstrap.js; then
            echo "::error::Flutter bootstrap does not reference the versioned application bundle."
            exit 1
          fi
          for marker in 'Sign in' 'Reset password'; do
            if ! grep -aFq "$marker" build/web/main.dart.js; then
              echo "::error::The production Flutter bundle is missing the required existing-account auth marker: $marker"
              exit 1
            fi
          done
          if [[ "$TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED" == "true" ]] &&
             ! grep -aFq 'Create account' build/web/main.dart.js; then
            echo "::error::Registration was enabled but its native Create account flow is missing from the bundle."
            exit 1
          fi

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Confirm existing Cloudflare Pages project
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          projects="$(curl --retry 2 --retry-all-errors --retry-delay 2 -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" "$endpoint")"
          if [[ "$(jq -r '.success // false' <<<"$projects")" != "true" ]]; then
            echo "::error::Unable to verify the existing Cloudflare Pages project. No new project will be created."
            jq -c '{errors,messages}' <<<"$projects"
            exit 1
          fi
          if ! jq -e --arg project "$CLOUDFLARE_PAGES_PROJECT" '.result | any(.[]?; .name == $project)' <<<"$projects" >/dev/null; then
            echo "::error::The existing Pages project $CLOUDFLARE_PAGES_PROJECT was not found in the selected Cloudflare account. Refusing to create a replacement project."
            exit 1
          fi
          echo "Confirmed existing Pages project: $CLOUDFLARE_PAGES_PROJECT"

      - name: Protect the apex federation hostname from Pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT/domains"
          for domain in testagram.site www.testagram.site; do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 -o "$response_file" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/$domain" || true)"
            if [[ "$status" == "200" ]] && jq -e --arg domain "$domain" '.success == true and .result.name == $domain' "$response_file" >/dev/null; then
              if [[ "$domain" == "testagram.site" ]]; then
                echo "::error::testagram.site is still attached to Cloudflare Pages. The apex is reserved for Backend/Federation routing."
                jq -c '.result | {name,status,validation_data,verification_data}' "$response_file"
                rm -f "$response_file"
                exit 1
              fi
              echo "::notice::www.testagram.site remains on its legacy Pages association until the separate guarded Worker cutover; this preview workflow will not modify that association."
            elif [[ "$status" != "404" ]]; then
              echo "::error::Could not safely verify Pages ownership for $domain (HTTP $status). Refusing to deploy a preview while ownership is ambiguous."
              jq -c '{success,errors,messages}' "$response_file" || true
              rm -f "$response_file"
              exit 1
            else
              echo "$domain is not attached to Pages."
            fi
            rm -f "$response_file"
          done

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy build/web --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch preview --commit-dirty=true

      - name: Smoke-test Pages preview auth entry and versioned bundle
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_SHA"
          paths=(
            '/'
            '/?mode=signin'
            '/?mode=signup'
            '/?mode=forgot'
            '/?mode=verification&userId=smoke-user&secret=smoke-secret'
            '/?mode=recovery&userId=smoke-user&secret=smoke-secret'
          )
          # Pages serves only the preview branch. The apex is the Backend federation edge and must redirect, not serve Flutter assets.
          for hostname in preview.testagram-flutter-web.pages.dev; do
            page="$(mktemp)"
            headers="$(mktemp)"
            for path in "${paths[@]}"; do
              if ! curl --fail --location --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
                --max-time 30 -D "$headers" "https://$hostname$path" -o "$page"; then
                echo "::error::https://$hostname$path did not return a successful response."
                rm -f "$page" "$headers"
                exit 1
              fi
              if ! grep -Fq "flutter_bootstrap.js?v=$version" "$page"; then
                echo "::error::https://$hostname$path is not serving the current versioned Flutter bootstrap ($version)."
                rm -f "$page" "$headers"
                exit 1
              fi
              for header in 'referrer-policy: no-referrer' 'x-content-type-options: nosniff' 'x-frame-options: DENY'; do
                if ! grep -iFq "$header" "$headers"; then
                  echo "::error::Required Pages security header missing for https://$hostname$path: $header"
                  cat "$headers"
                  rm -f "$page" "$headers"
                  exit 1
                fi
              done
            done

            for asset in "flutter_bootstrap.js?v=$version" "main.dart.js?v=$version"; do
              asset_body="$(mktemp)"
              asset_headers="$(mktemp)"
              if ! curl --fail --location --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
                --max-time 60 -D "$asset_headers" "https://$hostname/$asset" -o "$asset_body"; then
                echo "::error::Versioned Flutter asset is unavailable: https://$hostname/$asset"
                rm -f "$page" "$headers" "$asset_body" "$asset_headers"
                exit 1
              fi
              if [[ "$asset" == flutter_bootstrap.js* ]] && ! grep -Fq "main.dart.js?v=$version" "$asset_body"; then
                echo "::error::Flutter bootstrap at https://$hostname/$asset does not reference the current versioned app bundle."
                rm -f "$page" "$headers" "$asset_body" "$asset_headers"
                exit 1
              fi
              if [[ "$asset" == main.dart.js* ]]; then
                for marker in 'Sign in' 'Reset password'; do
                  if ! grep -aFq "$marker" "$asset_body"; then
                    echo "::error::Production bundle at https://$hostname/$asset is missing existing-account auth marker: $marker"
                    rm -f "$page" "$headers" "$asset_body" "$asset_headers"
                    exit 1
                  fi
                done
                if [[ "$TESTAGRAM_IDENTITY_REGISTRATION_UI_ENABLED" == "true" ]] &&
                   ! grep -aFq 'Submit application' "$asset_body"; then
                  echo "::error::Registration was enabled but the native Create account flow is missing from the deployed bundle."
                  rm -f "$page" "$headers" "$asset_body" "$asset_headers"
                  exit 1
                fi
              fi
              rm -f "$asset_body" "$asset_headers"
            done
            echo "Verified current versioned auth bundle and callback entry points on https://$hostname"
            rm -f "$page" "$headers"
          done

          apex_headers="$(mktemp)"
          apex_status="$(curl --silent --show-error --max-time 30 -D "$apex_headers" -o /dev/null -w '%{http_code}' "https://testagram.site/" || true)"
          if [[ "$apex_status" != "308" ]] || ! grep -Fqi 'https://www.testagram.site/' "$apex_headers"; then
            echo "::error::The apex must remain on the Backend/Federation edge and redirect to https://www.testagram.site (HTTP $apex_status)."
            cat "$apex_headers"
            rm -f "$apex_headers"
            exit 1
          fi
          rm -f "$apex_headers"
          apex_webfinger="$(curl --silent --show-error --max-time 30 -o /tmp/apex-webfinger.json -w '%{http_code}' "https://testagram.site/.well-known/webfinger?resource=acct:nonexistent-probe@invalid.testagram.site" || true)"
          case "$apex_webfinger" in
            200|400|404) ;;
            *) echo "::error::Apex WebFinger did not reach the Backend Federation service (HTTP $apex_webfinger)."; cat /tmp/apex-webfinger.json 2>/dev/null || true; exit 1 ;;
          esac
          echo "Verified the Pages preview bundle plus apex federation redirect and WebFinger routing; production www remains on the self-hosted origin."
