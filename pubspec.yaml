name: testagram
description: Native Flutter client for Testagram.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  appwrite: ^13.0.0
  # Appwrite 13 permits the 3.x range, but 3.1.2 still uses the removed Android v1 Registrar.
  # Pin the maintained V2-embedding implementation for current Flutter/Android toolchains.
  flutter_web_auth_2: ^5.1.0
  http: ^1.2.2
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
