name: testagram
description: Native Flutter client for Testagram.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  crypto: ^3.0.6
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_secure_storage: ^10.3.4
  video_player: ^2.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/testagram-icon.webp
